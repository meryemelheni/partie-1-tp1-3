---
- name: Créer le dossier de l'application
  ansible.builtin.file:
    path: "{{ app_dir }}"
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    mode: "0755"

- name: Cloner / mettre à jour le dépôt
  ansible.builtin.git:
    repo: "{{ app_repo }}"
    dest: "{{ app_dir }}"
    version: "{{ app_version }}"
    force: true
  become_user: "{{ app_user }}"
  register: app_git
  notify: restart app

- name: Vérifier si un build existe déjà
  ansible.builtin.stat:
    path: "{{ app_dir }}/.next/BUILD_ID"
  register: app_build

- name: Installer les dépendances (npm ci)
  ansible.builtin.command:
    cmd: npm ci
    chdir: "{{ app_dir }}"
  become_user: "{{ app_user }}"
  when: app_git.changed or not app_build.stat.exists

- name: Construire l'application (npm run build)
  ansible.builtin.command:
    cmd: npm run build
    chdir: "{{ app_dir }}"
  become_user: "{{ app_user }}"
  when: app_git.changed or not app_build.stat.exists

- name: Vérifier si le process PM2 existe
  ansible.builtin.command:
    cmd: pm2 describe portfolio
  become_user: "{{ app_user }}"
  register: app_pm2
  changed_when: false
  failed_when: false

- name: Démarrer l'application avec PM2
  ansible.builtin.command:
    cmd: pm2 start npm --name portfolio -- start
    chdir: "{{ app_dir }}"
  environment:
    PORT: "{{ app_port }}"
  become_user: "{{ app_user }}"
  when: app_pm2.rc != 0
  register: app_pm2_start

- name: Sauvegarder la liste des process PM2
  ansible.builtin.command:
    cmd: pm2 save
  become_user: "{{ app_user }}"
  when: app_pm2_start is changed
  changed_when: true

- name: Activer PM2 au démarrage du serveur (systemd)
  ansible.builtin.command:
    cmd: "pm2 startup systemd -u {{ app_user }} --hp /home/{{ app_user }}"
    creates: "/etc/systemd/system/pm2-{{ app_user }}.service"
